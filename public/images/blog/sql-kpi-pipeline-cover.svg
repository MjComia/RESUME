<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" fill="none">
  <rect width="800" height="420" fill="#0B101B"/>
  <defs>
    <pattern id="bgrid2" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1E2D45" stroke-width="0.7" stroke-opacity="0.5"/>
    </pattern>
  </defs>
  <rect width="800" height="420" fill="url(#bgrid2)"/>
  <!-- Stage 1: Raw SQL -->
  <rect x="56" y="128" width="196" height="164" rx="8" fill="#111827" stroke="#243552" stroke-width="1.5"/>
  <text x="76" y="158" fill="#8B9BB4" font-family="monospace" font-size="11">01 / RAW EVENTS</text>
  <text x="76" y="190" fill="#14D9C4" font-family="monospace" font-size="12">SELECT user_id, ts</text>
  <text x="76" y="212" fill="#E6EDF7" font-family="monospace" font-size="12">FROM raw_orders</text>
  <text x="76" y="234" fill="#8B9BB4" font-family="monospace" font-size="11">WHERE status = &apos;PAID&apos;</text>
  <rect x="76" y="254" width="144" height="18" rx="4" fill="#162032"/>
  <text x="84" y="267" fill="#F59E0B" font-family="monospace" font-size="10">142,800 rows</text>

  <path d="M252 210 L302 210" stroke="#14D9C4" stroke-width="2"/>

  <!-- Stage 2: Window CTE -->
  <rect x="302" y="108" width="204" height="204" rx="8" fill="#162032" stroke="#14D9C4" stroke-width="1.75"/>
  <text x="322" y="138" fill="#14D9C4" font-family="monospace" font-size="11">02 / WINDOW CTE</text>
  <text x="322" y="170" fill="#E6EDF7" font-family="monospace" font-size="12">DENSE_RANK() OVER (</text>
  <text x="322" y="192" fill="#8B9BB4" font-family="monospace" font-size="12">  PARTITION BY cohort</text>
  <text x="322" y="214" fill="#8B9BB4" font-family="monospace" font-size="12">  ORDER BY month_idx</text>
  <text x="322" y="236" fill="#E6EDF7" font-family="monospace" font-size="12">)</text>
  <rect x="322" y="262" width="164" height="26" rx="4" fill="#0B101B" stroke="#1E2D45"/>
  <text x="334" y="279" fill="#14D9C4" font-family="monospace" font-size="11">Deduplicated &amp; Typed</text>

  <path d="M506 210 L556 210" stroke="#F59E0B" stroke-width="2"/>

  <!-- Stage 3: Decision KPI -->
  <rect x="556" y="128" width="188" height="164" rx="8" fill="#111827" stroke="#F59E0B" stroke-width="1.75"/>
  <text x="576" y="158" fill="#F59E0B" font-family="monospace" font-size="11">03 / DECISION KPI</text>
  <text x="576" y="204" fill="#E6EDF7" font-family="monospace" font-weight="bold" font-size="32">+21.6%</text>
  <text x="576" y="228" fill="#8B9BB4" font-family="monospace" font-size="11">Net Retention Lift</text>
  <path d="M576 266 L612 256 L648 260 L684 242 L720 230" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
</svg>

